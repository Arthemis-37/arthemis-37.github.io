<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Cours ESGI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Base thème sombre Docsify -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">

  <!-- Coloration syntaxique pour le code -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css">

  <!-- Style personnalisé Obsidian Dark -->
  <style>
    :root {
      --base-background-color: #1a1b26;
      --sidebar-background: #14151f;
      --text-color-base: #c0caf5;
      --heading-color: #ffffff;
      --link-color: #bb9af7;
      --sidebar-nav-link-color: #9aa5ce;
      --sidebar-nav-link-color--active: #ffffff;
    }

    body {
      background-color: #1a1b26 !important;
      color: #c0caf5 !important;
    }

    .sidebar {
      background-color: #14151f !important;
      border-right: 1px solid #24283b;
    }

    /* Style du menu actif (accent violet) */
    .sidebar-nav li.active > a {
      background-color: #7aa2f733 !important;
      color: #bb9af7 !important;
      border-right: 3px solid #bb9af7;
      border-radius: 4px;
      font-weight: bold;
    }

    /* Blocs de code */
    pre[class*="language-"] {
      background: #16161e !important;
      border: 1px solid #24283b;
      border-radius: 8px;
    }

    code {
      color: #bb9af7 !important;
      background: #24283b !important;
    }

    /* Barre de recherche */
    .search input {
      background: #24283b !important;
      color: #fff !important;
      border: 1px solid #414868 !important;
      border-radius: 6px;
    }

    /* --- CORRECTION DES TABLEAUX --- */
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.5rem 0;
      color: #c0caf5 !important;
    }

    th {
      background-color: #1f2335 !important;
      color: #7aa2f7 !important;
      border: 1px solid #3b4261 !important;
      padding: 10px 14px;
      font-weight: 600;
    }

    td {
      border: 1px solid #24283b !important;
      padding: 10px 14px;
      color: #c0caf5 !important;
    }

    /* Fond uni/alterné sombre (supprime le blanc) */
    tr {
      background-color: #1a1b26 !important;
      border-top: none !important;
    }

    tr:nth-child(2n) {
      background-color: #16161e !important;
    }

    tr:hover {
      background-color: #24283b !important;
    }
  </style>
</head>
<body>
  <div id="app">Chargement...</div>
  <script>
    window.$docsify = {
      name: 'Cours ESGI',
      repo: 'arthemis-37/arthemis-37.github.io',
      loadSidebar: true,
      subMaxLevel: 2,
      search: {
        placeholder: 'Rechercher un cours...',
        noData: 'Aucun résultat'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  
  <!-- Coloration syntaxique -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-kotlin.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
</body>
</html>
